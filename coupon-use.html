<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEAM GREEN - 쿠폰 서비스</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  /* 기본 스타일 초기화 */
  :root {
    --bg-color: #ffffff;
    --text-main: #333333;
    --text-red: #ff0000;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background-color: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  /* 전체 컨테이너 */
  #app {
    width: 100%;
    max-width: 450px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* 쿠폰 카드 영역 */
  .coupon-card {
    width: 100%;
    position: relative;
    overflow: hidden;
    line-height: 1.2;
  }

  /* 배경 이미지 설정 */
  .coupon-img {
    width: 100%;
    display: block;
  }

  /* 데이터 오버레이 스타일 */
  .overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }

  /* 텍스트 위치 정밀 조정 공통 */
  .field { position: absolute; font-weight: 700; }

  /* [1] 업체명 */
  .v-name { top: 30.5%; left: 19%; font-size: 1.6rem; color: #1E5F35; font-weight: bold; }
  
  /* [1] 할인내용 (컨베이어 벨트 움직임 전광판 틀) */
  .v-type-container { 
    position: absolute;
    top: 34%; 
    left: 19%; 
    right: 19%;        /* 글자가 카드를 벗어나지 않도록 막는 한계선 */
    height: 4.5rem;    /* 텍스트 높이 확보 */
    overflow: hidden;  /* 영역을 벗어나는 글자는 숨김 */
    display: flex;
    align-items: center;
  }

  /* 실제 움직이는 텍스트 속성 */
  .v-type { 
    font-size: 3.2rem; /* 눈을 담다 배경에 맞춰 시인성 좋은 크기로 소폭 조정 */
    font-weight: 700; 
    color: #000; 
    white-space: nowrap; /* 줄바꿈 방지 */
    display: inline-block;
    padding-right: 50px; /* 순환할 때 글자 사이의 여백 */
  }

  /* 글자가 길 때만 서버스크립트에 의해 활성화되는 애니메이션 클래스 */
  .marquee-active {
    animation: marquee 10s linear infinite;
  }
  
  /* 컨베이어 벨트 애니메이션 정의 */
  @keyframes marquee {
    0% { transform: translate3d(0, 0, 0); }
    100% { transform: translate3d(-50%, 0, 0); } /* 두 개 붙은 텍스트 중 정확히 절반만큼 이동 */
  }
  
  /* [1] 쿠폰이름 (우측 하단) */
  .v-title { top: 43%; right: 19%; font-size: 0.95rem; color: #555; }
  
  /* [2] 발급일 위치 조정 */
  .v-issued { bottom: 46%; left: 20%; font-size: 1.1rem; color: #666; }
  
  /* [2] 만료일 위치 조정 */
  .v-expire { bottom: 46%; left: 50%; font-size: 1.1rem; color: var(--text-red); }

  /* [3] 상태 배지 기본 공통 속성 */
  .v-status { font-size: 0.85rem; }

  /* [3] 미사용일 때의 독립된 위치 */
  .status-unused {
    bottom: 50.9%;
    right: 19%;
  }

  /* [3] 사용완료일 때의 독립된 위치 */
  .status-used {
    bottom: 50.9%; 
    right: 14.2%;
    transform: translateX(-50%);
    font-size: 0.7rem;
  }

  /* [4] 토큰 정보 영역 숨기기 */
  .token-info {
    display: none !important;
  }

  /* 클릭 가능한 버튼 영역 */
  .use-btn-area {
    position: absolute;
    bottom: 33.5%;
    left: 50%;
    transform: translateX(-50%);
    width: 65%;
    height: 8%;
    cursor: pointer;
    background: transparent;
    border: none;
    pointer-events: auto;
  }

  /* 로딩 및 에러 스타일 */
  .status-msg { padding: 50px; text-align: center; background: white; border-radius: 20px; }

  /* 사용 완료 시 필터 */
  .is-used .coupon-img { filter: saturate(0.8); }
</style>
</head>
<body>

<div id="app">
  <div class="status-msg" id="loading">쿠폰 정보를 불러오는 중...</div>
</div>

<script>
const CONFIG = {
  SUPABASE_URL: 'https://scanpvkimaicpergakbe.supabase.co',
  SUPABASE_KEY: 'sb_publishable_CGS5dAKGRMOJwee2AsLtag_Q4zFLOVy',
  TABLE: 'coupons',
  IMG_BEFORE: '쿠폰 사용 전 기본.png',
  IMG_AFTER: '쿠폰 사용완료 기본.png'
};

async function sbRequest(path, options = {}) {
  const res = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${path}`, {
    headers: {
      'apikey': CONFIG.SUPABASE_KEY,
      'Authorization': `Bearer ${CONFIG.SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      ...options.headers
    },
    ...options
  });
  if (!res.ok) throw new Error('네트워크 응답 오류');
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

const params = new URLSearchParams(location.search);
const token = params.get('token');
let couponData = null;

async function init() {
  if (!token) {
    showError('잘못된 접근입니다.', '쿠폰 토큰이 없습니다.');
    return;
  }

  try {
    const data = await sbRequest(`${CONFIG.TABLE}?token=eq.${token}&limit=1`);
    if (!data || data.length === 0) {
      showError('쿠폰을 찾을 수 없습니다.', '이미 만료되었거나 삭제된 쿠폰입니다.');
      return;
    }
    couponData = data[0];
    render();
  } catch (e) {
    showError('연결 오류', '서버에 접속할 수 없습니다.');
  }
}

function showError(title, desc) {
  document.getElementById('app').innerHTML = `
    <div class="status-msg">
      <h2>${title}</h2><p>${desc}</p>
    </div>`;
}

function render() {
  const isUsed = couponData.status === 'used';
  const currentImg = isUsed ? CONFIG.IMG_AFTER : CONFIG.IMG_BEFORE;
  const statusText = isUsed ? '사용완료' : '미사용';
  const statusColor = isUsed ? '#888' : '#7c3aed';
  
  const statusClass = isUsed ? 'status-used' : 'status-unused';

  document.getElementById('app').innerHTML = `
    <div class="coupon-card ${isUsed ? 'is-used' : ''}">
      <img src="${currentImg}" class="coupon-img" alt="쿠폰배경">

      <div class="overlay">
        <div class="field v-name">${couponData.vendor}</div>
        <div class="field v-title">${couponData.title}</div>
        
        <div class="v-type-container" id="couponTypeContainer">
          <div class="v-type" id="couponTypeField">${couponData.coupon_type}</div>
        </div>
        
        <div class="field v-status ${statusClass}" style="color: ${statusColor}">${statusText}</div>
        
        <div class="field v-issued">${couponData.issued_date || '2026-05-27'}</div>
        <div class="field v-expire">${couponData.expire_date || '2026-00-00'}</div>

        <div class="token-info">
          <span>${couponData.token.substring(0,6)}</span>
          <span>${couponData.token.substring(6,12)}</span>
          <span>${couponData.token.substring(12,18)}</span>
        </div>

        ${!isUsed ? `<button class="use-btn-area" onclick="useCoupon()"></button>` : ''}
      </div>
    </div>
  `;

  // 글자 길이를 판단하여 무한 순환 전광판 효과 적용
  applyMarqueeEffect();
}

function applyMarqueeEffect() {
  const container = document.getElementById('couponTypeContainer');
  const field = document.getElementById('couponTypeField');
  if (!container || !field) return;

  // 텍스트가 컨테이너 너비보다 길어 자르는 상황인지 체크
  if (field.offsetWidth > container.offsetWidth) {
    // 컨베이어 벨트처럼 끊김 없이 무한 순환시키기 위해 똑같은 텍스트 구조를 뒤에 복제해 붙입니다.
    const clone = field.cloneNode(true);
    container.appendChild(clone);

    // 애니메이션 가동 클래스 주입
    field.classList.add('marquee-active');
    clone.classList.add('marquee-active');
    
    // 만약 글자 수가 압도적으로 길다면 (예: 아메리카노 택 1 문구 등), 글씨 크기를 유연하게 약간 줄여서 회전시킵니다.
    if (field.textContent.length >= 25) {
      field.style.fontSize = '1.4rem';
      clone.style.fontSize = '1.4rem';
      container.style.top = '36%'; // 위치 보정
    }
  }
}

async function useCoupon() {
  if (!confirm('쿠폰을 지금 사용하시겠습니까?')) return;

  try {
    const today = new Date().toISOString().split('T')[0];
    await sbRequest(`${CONFIG.TABLE}?token=eq.${token}`, {
      method: 'PATCH',
      body: JSON.stringify({ status: 'used', used_date: today })
    });
    alert('사용 처리가 완료되었습니다.');
    location.reload();
  } catch (e) {
    alert('오류가 발생했습니다. 다시 시도해주세요.');
  }
}

init();
</script>
</body>
</html>
