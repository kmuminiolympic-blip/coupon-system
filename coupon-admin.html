<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KMU 미니올림픽 쿠폰 발급 관리 시스템</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #1a1a26;
    --surface3: #22223a;
    --border: rgba(120,120,200,0.12);
    --border2: rgba(120,120,200,0.25);
    --accent: #7c6af0;
    --accent2: #a78bfa;
    --gold: #f5c842;
    --teal: #2dd4bf;
    --coral: #f87171;
    --text: #e8e8f0;
    --text2: #9898b8;
    --text3: #6060a0;
    --radius: 12px;
    --radius2: 8px;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 32px; font-size: 14px; }
  
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  .logo { font-size: 18px; font-weight: 700; color: var(--accent2); display: flex; align-items: center; gap: 8px; }
  
  .db-status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); font-family: 'JetBrains Mono', monospace; }
  .db-dot { width: 8px; height: 8px; border-radius: 50%; background: #6060a0; }
  .db-dot.ok { background: var(--teal); }
  .db-dot.err { background: var(--coral); }

  .section-title { font-size: 13px; font-weight: 600; letter-spacing: 1px; color: var(--text3); text-transform: uppercase; margin: 24px 0 12px 0; display: flex; align-items: center; gap: 6px; }
  .section-title::before { content:''; display:block; width:3px; height:12px; background: var(--accent); border-radius: 2px; }

  /* 대시보드 구조 초간소화 */
  .grid-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
  .card-stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; position: relative; }
  .card-stat::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; border-radius: 3px 3px 0 0; }
  .card-stat.total::before { background: var(--accent); }
  .card-stat.pd::before { background: #f59e0b; }
  .card-stat.dg::before { background: #10b981; }
  .card-stat.nd::before { background: #8b5cf6; }
  .stat-lbl { font-size: 12px; color: var(--text3); margin-bottom: 4px; font-weight: 500; }
  .stat-val { font-size: 24px; font-weight: 700; font-family: 'JetBrains Mono', monospace; color: var(--text); }
  .stat-val span { font-size: 14px; color: var(--text3); font-weight: 400; }

  /* 리모컨 박스 강화 */
  .control-panel { background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius); padding: 20px; display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
  .btn-live-window { background: linear-gradient(135deg, #f59e0b, #ef4444); color: white; border: none; border-radius: var(--radius2); padding: 12px 20px; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .btn-live-window:hover { opacity: 0.9; }
  
  .remote-box { display: none; align-items: center; gap: 12px; background: var(--surface2); padding: 8px 16px; border-radius: var(--radius2); border: 1px solid var(--border); }
  .remote-btn { background: var(--surface3); border: 1px solid var(--border2); color: var(--text); padding: 8px 16px; font-size: 13px; font-weight: 600; border-radius: 6px; cursor: pointer; }
  .remote-btn:hover:not(:disabled) { background: #f59e0b; color: #000; }
  .remote-btn:disabled { opacity: 0.2; cursor: not-allowed; }
  .remote-counter { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; color: var(--gold); min-width: 60px; text-align: center; }

  /* 발행 단축 에어리어 */
  .issue-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
  .issue-flex { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .btn-issue-loop { background: linear-gradient(135deg, var(--accent), #9f7aea); color: white; border: none; border-radius: var(--radius2); padding: 12px 24px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .btn-issue-loop:hover:not(:disabled) { opacity: 0.9; }
  .btn-issue-loop:disabled { opacity: 0.3; cursor: not-allowed; }
  .next-indicator { font-size: 12px; color: var(--text2); font-family: 'JetBrains Mono', monospace; background: var(--surface2); padding: 8px 14px; border-radius: 6px; border: 1px solid var(--border); }

  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--surface3); border: 1px solid var(--border2); border-radius: var(--radius2); padding: 10px 18px; font-size: 13px; z-index: 9999; color: var(--text); transform: translateY(10px); opacity: 0; transition: all 0.2s; pointer-events: none; }
  .toast.show { transform: translateY(0); opacity: 1; }

  /* PASSWORD LOCK SCREEN */
  .pw-screen { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 9999; align-items: center; justify-content: center; }
  .pw-screen.show { display: flex; }
  .pw-box { background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius); padding: 32px; width: 320px; text-align: center; }
  .pw-input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius2); color: var(--text); padding: 10px; font-size: 16px; font-family: 'JetBrains Mono', monospace; outline: none; text-align: center; margin-bottom: 12px; }
  .pw-btn { width: 100%; background: linear-gradient(135deg, var(--accent), #9f7aea); color: white; border: none; border-radius: var(--radius2); padding: 10px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>

<div class="pw-screen show" id="pwScreen">
  <div class="pw-box">
    <div style="font-size:28px; margin-bottom:12px;">🔐</div>
    <div style="font-weight:700; margin-bottom:16px;">관리자 비밀번호 입력</div>
    <input class="pw-input" type="password" id="pwInput" placeholder="••••••" onkeydown="if(event.key==='Enter') checkPassword()">
    <button class="pw-btn" onclick="checkPassword()">인증하기</button>
  </div>
</div>

<div class="header">
  <div class="logo">🎫 KMU 미니올림픽 쿠폰 시스템 <span style="font-size:12px; font-weight:400; color:var(--text3);">[마스터 콘솔]</span></div>
  <div class="db-status"><div class="db-dot" id="dbDot"></div><span id="dbLabel">연결 중...</span></div>
</div>

<div class="section-title">실시간 쿠폰 발급 및 충전 현황 (총 한도 310매 제한)</div>
<div class="grid-stats">
  <div class="card-stat total"><div class="stat-lbl">전체 발행 완료</div><div class="stat-val" id="cntTotal">0 <span>/ 310</span></div></div>
  <div class="card-stat pd"><div class="stat-lbl">🍊 풍동 (한도 100)</div><div class="stat-val" id="cntPd">0 <span>/ 100</span></div></div>
  <div class="card-stat dg"><div class="stat-lbl">🍏 닭동가리 (한도 130)</div><div class="stat-val" id="cntDg">0 <span>/ 130</span></div></div>
  <div class="card-stat nd"><div class="stat-lbl">🍇 눈을 담다 (한도 80)</div><div class="stat-val" id="cntNd">0 <span>/ 80</span></div></div>
</div>

<div class="section-title">현장 배포 듀얼 모니터 원격 제어</div>
<div class="control-panel">
  <button class="btn-live-window" onclick="openLiveWindow()">🖥 외부 디스플레이 배포 창 켜기</button>
  <div class="remote-box" id="remoteBox">
    <span style="font-size:12px; color:var(--gold); font-weight:600;">원격 리모컨 :</span>
    <button class="remote-btn" id="btnPrev" onclick="moveSlide(-1)">◀ 이전 쿠폰</button>
    <div class="remote-counter" id="remoteCounter">0 / 0</div>
    <button class="remote-btn" id="btnNext" onclick="moveSlide(1)">다음 쿠폰 ▶</button>
  </div>
</div>

<div class="section-title">쿠폰 고속 생성 처리기</div>
<div class="issue-box">
  <div class="issue-flex">
    <button class="btn-issue-loop" id="btnLoop" onclick="issueLoopCoupon()">🔄 순환 발행하기 (한 장씩 채우기)</button>
    <div class="next-indicator" id="nextIndicator">다음 대기 업체: 분석 중...</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://scanpvkimaicpergakbe.supabase.co';
const SUPABASE_KEY = 'sb_publishable_CGS5dAKGRMOJwee2AsLtag_Q4zFLOVy';
const TABLE = 'coupons';

// 하드코딩 지정 한도 수량 설정
const LIMITS = { '풍동': 100, '닭동가리': 130, '눈을 담다': 80 };
const LOOP_ORDER = ['풍동', '닭동가리', '눈을 담다'];
const VENDOR_MAPPING = { '풍동': '1,000원할인    ', '닭동가리': '음료증정', '눈을 담다': '아메리카노 1,000원 할인 / 요거트아이스크림 3,000원 할인 택  1    ' };

let coupons = [];
let liveWindow = null;
let liveCurrentIdx = 0;
let currentVendorTarget = '풍동';

async function sbFetch(path, options = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': options.prefer || '', ...options.headers }, ...options
  });
  if (!res.ok) throw new Error("네트워크 연동 실패");
  const text = await res.text(); return text ? JSON.parse(text) : null;
}

const ADMIN_PW = 'admin';
function checkPassword() {
  const input = document.getElementById('pwInput');
  if (input.value === ADMIN_PW) { sessionStorage.setItem('admin_auth', '1'); document.getElementById('pwScreen').classList.remove('show'); }
  else { alert('비밀번호 불일치'); input.value = ''; }
}

window.onload = async function() {
  if (sessionStorage.getItem('admin_auth') === '1') document.getElementById('pwScreen').classList.remove('show');
  await loadData();
  setInterval(loadData, 15000); // 15초 백그라운드 자동 동기화
  setInterval(() => { if (liveWindow && liveWindow.closed) { liveWindow = null; document.getElementById('remoteBox').style.display = 'none'; } }, 1000);
};

async function loadData() {
  try {
    const data = await sbFetch(`${TABLE}?status=neq.deleted`);
    coupons = data || [];
    setDbStatus(true);
    calculateStats();
  } catch (e) { setDbStatus(false); }
}

function setDbStatus(ok) {
  const dot = document.getElementById('dbDot'); const lbl = document.getElementById('dbLabel');
  dot.className = 'db-dot ' + (ok ? 'ok' : 'err'); lbl.textContent = ok ? 'Supabase 연동중' : '연결 끊김';
}

function calculateStats() {
  // 가볍게 개수 카운팅 집계
  const pCount = coupons.filter(c => c.vendor === '풍동').length;
  const dCount = coupons.filter(c => c.vendor === '닭동가리').length;
  const nCount = coupons.filter(c => c.vendor === '눈을 담다').length;

  document.getElementById('cntPd').innerHTML = `${pCount} <span>/ 100</span>`;
  document.getElementById('cntDg').innerHTML = `${dCount} <span>/ 130</span>`;
  document.getElementById('cntNd').innerHTML = `${nCount} <span>/ 80</span>`;
  document.getElementById('cntTotal').innerHTML = `${pCount + dCount + nCount} <span>/ 310</span>`;

  // 다음 생성 대기 순번 계산 자동 연동 알고리즘
  determineNextVendor(pCount, dCount, nCount);
  if (liveWindow && !liveWindow.closed) { syncLiveDisplay(); }
}

function determineNextVendor(p, d, n) {
  // 한도가 안 끝난 업체 중 균등 처리를 위해 최적의 타깃을 선택
  let options = [];
  if (p < LIMITS['풍동']) options.push('풍동');
  if (d < LIMITS['닭동가리']) options.push('닭동가리');
  if (n < LIMITS['눈을 담다']) options.push('눈을 담다');

  if (options.length === 0) {
    currentVendorTarget = null;
    document.getElementById('nextIndicator').textContent = "🎉 모든 쿠폰 한도 충전 완료 (310매 완판)";
    document.getElementById('btnLoop').disabled = true;
    return;
  }

  // 회전 순서 우선순위에 대입하여 매칭
  for (let i = 0; i < LOOP_ORDER.length; i++) {
    let checkVendor = LOOP_ORDER[i];
    if (options.includes(checkVendor)) {
      // 직전에 생성한 기록과 전체 비율을 가늠해 타깃 가중치 분배
      currentVendorTarget = checkVendor;
      break;
    }
  }
  if(!currentVendorTarget) currentVendorTarget = options[0];
  document.getElementById('nextIndicator').textContent = `다음 대기 업체: [${currentVendorTarget}]`;
}

async function issueLoopCoupon() {
  if (!currentVendorTarget) return;
  const vendor = currentVendorTarget;
  const existingCount = coupons.filter(c => c.vendor === vendor).length;
  
  if (existingCount >= LIMITS[vendor]) {
    showToast(`⚠ ${vendor} 한도가 초과되어 발급할 수 없습니다.`);
    await loadData(); return;
  }

  const btn = document.getElementById('btnLoop');
  btn.disabled = true;
  
  const token = Array.from(crypto.getRandomValues(new Uint8Array(32)), b => b.toString(16).padStart(2,'0')).join('');
  const url = `${location.origin}/coupon-use.html?token=${token}`;
  
  const today = new Date().toISOString().split('T')[0];
  const expDate = new Date(); expDate.setDate(expDate.getDate() + 30);
  
  const newCoupon = {
    token,
    title: `#${existingCount + 1}`,
    vendor: vendor,
    coupon_type: VENDOR_MAPPING[vendor],
    status: 'unused',
    issued_date: today,
    expire_date: expDate.toISOString().split('T')[0],
    url: url
  };

  try {
    const res = await sbFetch(TABLE, { method: 'POST', prefer: 'return=representation', body: JSON.stringify(newCoupon) });
    showToast(`✅ [${vendor}] ${newCoupon.title} 생성 성공!`);
    await loadData();
  } catch(e) {
    showToast("❌ 쿠폰 생성 중 오류 발생");
  } finally {
    btn.disabled = false;
  }
}

// =========================================================================
// 🖥 듀얼 모니터 외부 창 클라이언트 제어 아키텍처 (순환 정렬 구조 반영)
// =========================================================================
function openLiveWindow() {
  if (coupons.length === 0) { showToast("배포 가능한 쿠폰 데이터가 없습니다."); return; }
  
  if (liveWindow && !liveWindow.closed) { liveWindow.close(); }

  liveWindow = window.open('', 'KmuMiniOlympicLive', 'width=750,height=850,top=50,left=300,resizable=yes');
  if(!liveWindow) { alert("팝업 차단을 해제해 주세요!"); return; }

  liveWindow.document.write(`
    <!DOCTYPE html>
    <html>
    <head>
      <title>KMU 미니올림픽 현장 쿠폰 배포 스크린</title>
      <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
      <style>
        body { background: #050508; color: #e8e8f0; font-family: 'Noto Sans KR', sans-serif; text-align: center; padding: 50px 20px; overflow: hidden; margin:0; }
        .branding { font-size: 18px; color: #6060a0; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 30px; }
        .v-box { min-height: 100px; margin-bottom: 20px; }
        .v-name { font-size: 48px; font-weight: 700; color: #fff; text-shadow: 0 0 20px rgba(124,106,240,0.3); }
        .v-type { font-size: 18px; color: #a78bfa; margin-top: 8px; }
        .qr-area { background: #ffffff; padding: 24px; border-radius: 16px; display: inline-block; box-shadow: 0 25px 50px rgba(0,0,0,0.7); margin-bottom: 30px; }
        .lbl-title { font-family: 'JetBrains Mono', monospace; font-size: 15px; color: #f5c842; background: #111118; padding: 6px 16px; border-radius: 6px; display: inline-block; border: 1px solid rgba(120,120,200,0.1); }
      </style>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/script>
    </head>
    <body>
      <div class="branding">🏆 KMU 미니올림픽 현장 쿠폰 배포 스크린</div>
      <div class="v-box">
        <div class="v-name" id="lVendor">-</div>
        <div class="v-type" id="lType">-</div>
      </div>
      <div class="qr-area"><div id="winQr"></div></div>
      <br>
      <div class="lbl-title" id="lTitle">-</div>
    </body>
    </html>
  `);
  liveWindow.document.close();
  
  document.getElementById('remoteBox').style.display = 'flex';
  liveCurrentIdx = 0;
  syncLiveDisplay();
}

function getSortedCoupons() {
  // 사용자가 스캔해 갈 수 있는 미사용 실시간 순환 정렬 구조 정의 (#1끼리 정렬 -> #2끼리 정렬 순)
  return coupons.sort((a, b) => {
    const numA = parseInt(a.title.replace(/[^0-9]/g, '')) || 0;
    const numB = parseInt(b.title.replace(/[^0-9]/g, '')) || 0;
    if (numA !== numB) return numA - numB;
    return LOOP_ORDER.indexOf(a.vendor) - LOOP_ORDER.indexOf(b.vendor);
  });
}

function syncLiveDisplay() {
  if (!liveWindow || liveWindow.closed) return;
  const sorted = getSortedCoupons();
  if (sorted.length === 0) return;

  if (liveCurrentIdx >= sorted.length) liveCurrentIdx = sorted.length - 1;
  if (liveCurrentIdx < 0) liveCurrentIdx = 0;

  const target = sorted[liveCurrentIdx];
  const doc = liveWindow.document;

  // 텍스트 매핑 반영
  doc.getElementById('lVendor').textContent = target.vendor;
  doc.getElementById('lType').textContent = target.coupon_type;
  doc.getElementById('lTitle').textContent = `일련번호: ${target.vendor} ${target.title}`;

  // QR 렌더링 리프레시
  const qrContainer = doc.getElementById('winQr');
  qrContainer.innerHTML = '';
  new liveWindow.QRCode(qrContainer, {
    text: target.url,
    width: 320,
    height: 320,
    colorDark: '#000000',
    colorLight: '#ffffff',
    correctLevel: 1
  });

  // 콘솔 제어창 리모컨 동기화
  document.getElementById('remoteCounter').textContent = `${liveCurrentIdx + 1} / ${sorted.length}`;
  document.getElementById('btnPrev').disabled = (liveCurrentIdx === 0);
  document.getElementById('btnNext').disabled = (liveCurrentIdx === sorted.length - 1);
}

function moveSlide(dir) {
  const sorted = getSortedCoupons();
  const nextIdx = liveCurrentIdx + dir;
  if (nextIdx >= 0 && nextIdx < sorted.length) {
    liveCurrentIdx = nextIdx;
    syncLiveDisplay();
  }
}

function showToast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
</script>
</body>
</html>
