<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쿠폰 사용</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: #111;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  /* 에러 / 로딩 */
  .error-page {
    text-align: center;
    background: white;
    border-radius: 24px;
    padding: 48px;
    max-width: 400px;
  }
  .error-icon { font-size: 48px; margin-bottom: 16px; }
  .error-title { font-size: 20px; font-weight: 700; color: #1e1b4b; margin-bottom: 8px; }
  .error-desc { font-size: 14px; color: #888; }
  .loading-page { text-align: center; color: #aaa; font-size: 14px; }
  .loading-spinner {
    width: 40px; height: 40px;
    border: 3px solid #333;
    border-top-color: #7c3aed;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── 쿠폰 래퍼 ── */
  .coupon-wrapper {
    width: 100%;
    max-width: 390px;
    position: relative;
    z-index: 1;
  }

  /* ── 쿠폰 카드 ── */
  .coupon-card {
    border-radius: 28px;
    overflow: hidden;
    border: 3px solid #2d4a1e;
    position: relative;
    transition: all 0.4s ease;
    background: #fff;
  }
  .coupon-card.used { filter: grayscale(0.4); }

  /* ── 상단: 이미지 배경 + 오버레이 정보 ── */
  .coupon-top {
    position: relative;
    min-height: 220px;
    overflow: hidden;
  }
  /* 배경 이미지 */
  .coupon-bg-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }
  /* 이미지 위 반투명 오버레이 (가독성 확보) */
  .coupon-top-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
  }
  /* 텍스트 컨텐츠 (이미지/오버레이 위) */
  .coupon-top-content {
    position: relative;
    z-index: 2;
    padding: 24px 24px 20px 24px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    min-height: 220px;
  }
  /* 팀GREEN 로고 뱃지 (좌상단) */
  .team-logo-badge {
    position: absolute;
    top: 20px;
    left: 24px;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 7px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 20px;
    padding: 6px 12px 6px 8px;
  }
  .team-logo-badge img {
    width: 22px;
    height: 22px;
    object-fit: contain;
  }
  .team-logo-badge span {
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1.5px;
  }
  /* 업체명 */
  .coupon-vendor-name {
    font-size: 13px;
    font-weight: 500;
    color: rgba(255,255,255,0.7);
    margin-bottom: 4px;
    letter-spacing: 0.5px;
  }
  /* 할인내용 */
  .coupon-discount-text {
    font-size: 34px;
    font-weight: 800;
    color: #fff;
    line-height: 1.15;
    text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    margin-bottom: 8px;
  }
  /* 쿠폰이름 */
  .coupon-name-label {
    font-size: 13px;
    font-weight: 500;
    color: rgba(255,255,255,0.65);
    letter-spacing: 0.5px;
    align-self: flex-end;
  }

  /* ── 구분선 (티켓 노치) ── */
  .coupon-divider {
    display: flex;
    align-items: center;
    position: relative;
    margin: 0 -3px;
    background: #f0ebff;
  }
  .divider-circle-left, .divider-circle-right {
    width: 28px; height: 28px;
    background: #111;
    border-radius: 50%;
    flex-shrink: 0;
    border: 3px solid #2d4a1e;
    z-index: 2;
  }
  .divider-circle-left { border-left: none; margin-left: -3px; }
  .divider-circle-right { border-right: none; margin-right: -3px; }
  .divider-line {
    flex: 1;
    border-top: 2.5px dashed #aaa;
  }

  /* ── 중단: 날짜/상태 ── */
  .coupon-mid {
    background: #f0ebff;
    padding: 16px 24px 16px 24px;
    position: relative;
  }
  .status-badge {
    position: absolute;
    top: 14px; right: 22px;
    background: #7c3aed;
    color: white;
    font-size: 12px; font-weight: 700;
    padding: 4px 13px;
    border-radius: 20px;
  }
  .status-badge.used-badge { background: #9ca3af; }
  .status-badge.expired-badge { background: #ef4444; }
  .coupon-dates {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px 16px;
  }
  .meta-label {
    font-size: 12px; font-weight: 500;
    color: #7a7a9a; margin-bottom: 2px;
  }
  .meta-value {
    font-size: 15px; font-weight: 700;
    color: #1e1b4b;
    font-family: 'JetBrains Mono', monospace;
  }
  .meta-value.expire-red { color: #e03030; }

  /* ── 구분선 2 ── */
  .coupon-divider2 {
    display: flex;
    align-items: center;
    margin: 0 -3px;
    background: #fff;
  }
  .divider2-circle-left, .divider2-circle-right {
    width: 28px; height: 28px;
    background: #111;
    border-radius: 50%;
    flex-shrink: 0;
    border: 3px solid #2d4a1e;
    z-index: 2;
  }
  .divider2-circle-left { border-left: none; margin-left: -3px; }
  .divider2-circle-right { border-right: none; margin-right: -3px; }
  .divider2-line {
    flex: 1;
    border-top: 2.5px dashed #ccc;
  }

  /* ── 하단: 버튼 ── */
  .coupon-bottom {
    background: #fff;
    padding: 18px 22px 18px 22px;
  }
  .btn-use {
    width: 100%;
    background: #7c3aed;
    color: white; border: none;
    border-radius: 14px;
    padding: 17px 16px;
    font-size: 17px; font-weight: 700;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-bottom: 10px;
  }
  .btn-use:hover { opacity: 0.92; transform: translateY(-1px); }
  .btn-use:active { transform: translateY(0); }
  .btn-use.used-btn {
    background: linear-gradient(135deg, #d1d5db, #9ca3af);
    cursor: not-allowed; pointer-events: none;
  }
  .token-strip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: #bbb;
    text-align: center; word-break: break-all;
  }

  /* ── USED 도장 ── */
  .used-stamp {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotate(-20deg);
    border: 4px solid rgba(156,163,175,0.7);
    color: rgba(107,114,128,0.7);
    border-radius: 12px;
    padding: 8px 20px;
    font-size: 36px; font-weight: 900; letter-spacing: 4px;
    pointer-events: none; z-index: 10;
    white-space: nowrap; display: none;
  }
  .coupon-card.used .used-stamp { display: block; }

  /* ── 확인 오버레이 ── */
  .confirm-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    align-items: flex-end; justify-content: center;
    padding: 24px;
  }
  .confirm-overlay.show { display: flex; }
  .confirm-sheet {
    background: white; border-radius: 24px 24px 20px 20px;
    padding: 28px 24px; width: 100%; max-width: 400px;
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(40px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .confirm-warn {
    background: #fff7ed; border: 1px solid #fed7aa;
    border-radius: 12px; padding: 14px 16px;
    display: flex; align-items: center; gap: 10px; margin-bottom: 20px;
  }
  .warn-icon { font-size: 20px; }
  .warn-text { font-size: 14px; font-weight: 600; color: #92400e; line-height: 1.4; }
  .confirm-title { font-size: 18px; font-weight: 700; color: #1e1b4b; margin-bottom: 8px; }
  .confirm-desc { font-size: 13px; color: #6b7280; margin-bottom: 24px; line-height: 1.6; }
  .confirm-btns { display: flex; gap: 10px; }
  .btn-cancel {
    flex: 1; background: #f3f4f6; border: none;
    border-radius: 12px; padding: 14px;
    font-size: 14px; font-weight: 600; color: #6b7280; cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif; transition: background 0.15s;
  }
  .btn-cancel:hover { background: #e5e7eb; }
  .btn-confirm-use {
    flex: 2;
    background: linear-gradient(135deg, #7c3aed, #6d28d9);
    color: white; border: none; border-radius: 12px; padding: 14px;
    font-size: 14px; font-weight: 700; cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    box-shadow: 0 4px 12px rgba(124,58,237,0.3); transition: all 0.15s;
  }
  .btn-confirm-use:hover { opacity: 0.9; }
  .btn-confirm-use:disabled { opacity: 0.6; cursor: not-allowed; }
</style>
</head>
<body>

<div id="app">
  <div class="loading-page">
    <div class="loading-spinner"></div>
    쿠폰 정보를 불러오는 중...
  </div>
</div>

<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-sheet">
    <div class="confirm-warn">
      <span class="warn-icon">⚠️</span>
      <span class="warn-text">사용하면 쿠폰이 소멸됩니다.</span>
    </div>
    <div class="confirm-title">쿠폰을 사용하시겠습니까?</div>
    <div class="confirm-desc">이 쿠폰은 일회성입니다.<br>사용 후에는 다시 사용할 수 없습니다.</div>
    <div class="confirm-btns">
      <button class="btn-cancel" onclick="cancelUse()">취소</button>
      <button class="btn-confirm-use" id="confirmBtn" onclick="confirmUse()">사용하기</button>
    </div>
  </div>
</div>

const SUPABASE_URL = 'https://scanpvkimaicpergakbe.supabase.co';
const SUPABASE_KEY = 'sb_publishable_CGS5dAKGRMOJwee2AsLtag_Q4zFLOVy';
const TABLE = 'coupons';

async function sbFetch(path, options = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': options.prefer || '',
      ...options.headers
    },
    ...options
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || res.statusText);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

async function dbGetCouponByToken(token) {
  const data = await sbFetch(`${TABLE}?token=eq.${encodeURIComponent(token)}&limit=1`);
  return data && data.length > 0 ? data[0] : null;
}

async function dbMarkUsed(token) {
  const usedDate = new Date().toISOString().split('T')[0];
  await sbFetch(`${TABLE}?token=eq.${encodeURIComponent(token)}`, {
    method: 'PATCH',
    body: JSON.stringify({ status: 'used', used_date: usedDate })
  });
  return usedDate;
}

  if (!token) { renderError('유효하지 않은 쿠폰입니다', '쿠폰 링크를 다시 확인해주세요.'); return; }

  catch (e) { renderError('서버 연결 오류', '잠시 후 다시 시도해주세요: ' + e.message); return; }
  if (!couponData) { renderError('쿠폰을 찾을 수 없습니다', '만료되었거나 존재하지 않는 쿠폰입니다.'); return; }
  if (couponData.status === 'deleted') { renderError('삭제된 쿠폰입니다', '이 쿠폰은 더 이상 유효하지 않습니다.'); return; }
  const today = new Date().toISOString().split('T')[0];
  const isExpired = couponData.expire_date && today > couponData.expire_date && couponData.status !== 'used';
  const isUsed = couponData.status === 'used';
  renderCoupon(isUsed, isExpired);
}

function renderError(title, desc) {
  document.getElementById('app').innerHTML = `
    <div class="error-page">
      <div class="error-icon">❌</div>
      <div class="error-title">${title}</div>
      <div class="error-desc">${desc}</div>
    </div>`;
}

function renderCoupon(isUsed, isExpired) {
  const c = couponData;
  const statusText = isUsed ? '사용완료' : (isExpired ? '기간만료' : '미사용');
  const badgeClass = isUsed ? 'status-badge used-badge' : (isExpired ? 'status-badge expired-badge' : 'status-badge');
  const btnText = isUsed ? '✓ 사용완료' : (isExpired ? '기간 만료됨' : '쿠폰 사용하기');
  const btnIcon = (!isUsed && !isExpired) ? '<span>🎫</span>' : '';
  const btnClass = (isUsed || isExpired) ? 'btn-use used-btn' : 'btn-use';
  const disabled = (isUsed || isExpired) ? 'disabled' : '';
  const tokenDisplay = c.token ? c.token.substring(0, 32) + '...' : '';
  const expireClass = (!isUsed && isExpired) ? 'meta-value expire-red' : 'meta-value';
  const bgSrc = VENDOR_BG[c.vendor] || DEFAULT_BG;
  const usedDateRow = isUsed ? `
    <div class="meta-item">
      <div class="meta-label">사용일</div>
      <div class="meta-value">${c.used_date || '-'}</div>
    </div>` : '';

  document.getElementById('app').innerHTML = `
    <div class="coupon-wrapper">
      <div class="coupon-card ${isUsed ? 'used' : ''}">
        <div class="used-stamp">USED</div>

        <!-- 상단: 이미지 배경 + 오버레이 텍스트 -->
        <div class="coupon-top">
          <img class="coupon-bg-img" src="${bgSrc}" alt="배경" />
          <div class="coupon-top-overlay"></div>

          <!-- 팀GREEN 로고 뱃지 (좌상단) -->
          <div class="team-logo-badge">
            <img src="${TEAMGREEN_LOGO}" alt="TEAM GREEN" />
            <span>TEAM GREEN</span>
          </div>

          <!-- 하단 텍스트 -->
          <div class="coupon-top-content">
            <div class="coupon-vendor-name">${c.vendor}</div>
            <div class="coupon-discount-text">${c.coupon_type}</div>
            <div class="coupon-name-label">${c.title}</div>
          </div>
        </div>

        <!-- 구분선 1 -->
        <div class="coupon-divider">
          <div class="divider-circle-left"></div>
          <div class="divider-line"></div>
          <div class="divider-circle-right"></div>
        </div>

        <!-- 중단: 날짜/상태 -->
        <div class="coupon-mid">
          <div class="${badgeClass}">${statusText}</div>
          <div class="coupon-dates">
            <div class="meta-item">
              <div class="meta-label">발급일</div>
              <div class="meta-value">${c.issued_date || '-'}</div>
            </div>
            <div class="meta-item">
              <div class="meta-label">만료일</div>
              <div class="${expireClass}">${c.expire_date || '-'}</div>
            </div>
            ${usedDateRow}
          </div>
        </div>

        <!-- 구분선 2 -->
        <div class="coupon-divider2">
          <div class="divider2-circle-left"></div>
          <div class="divider2-line"></div>
          <div class="divider2-circle-right"></div>
        </div>

        <!-- 하단: 버튼 + 토큰 -->
        <div class="coupon-bottom">
          <button class="${btnClass}" id="useBtn" onclick="requestUse()" ${disabled}>
            ${btnIcon}${btnText}
          </button>
          <div class="token-strip">${tokenDisplay}</div>
        </div>
      </div>
    </div>`;
}

function requestUse() {
  document.getElementById('confirmOverlay').classList.add('show');
}
function cancelUse() {
  document.getElementById('confirmOverlay').classList.remove('show');
}
async function confirmUse() {
  const btn = document.getElementById('confirmBtn');
  btn.disabled = true;
  btn.textContent = '처리 중...';
  try {
    const usedDate = await dbMarkUsed(token);
    couponData.status = 'used';
    couponData.used_date = usedDate;
  } catch (e) {
    btn.disabled = false;
    btn.textContent = '사용하기';
    alert('오류가 발생했습니다: ' + e.message);
    return;
  }
  document.getElementById('confirmOverlay').classList.remove('show');
  renderCoupon(true, false);
}

init();
</script>
</body>
</html>
