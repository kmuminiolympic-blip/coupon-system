<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쿠폰 사용</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f3ff;
    --surface: #ffffff;
    --border: rgba(120,80,240,0.12);
    --accent: #7c3aed;
    --accent2: #a78bfa;
    --accent3: #ddd6fe;
    --gold: #f59e0b;
    --text: #1e1b4b;
    --text2: #6d28d9;
    --text3: #a78bfa;
    --radius: 24px;
    --radius2: 16px;
    --radius3: 12px;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed; top: -120px; right: -80px;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(167,139,250,0.25) 0%, transparent 70%);
    pointer-events: none;
  }
  body::after {
    content: '';
    position: fixed; bottom: -80px; left: -60px;
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(124,58,237,0.15) 0%, transparent 70%);
    pointer-events: none;
  }

  .error-page {
    text-align: center;
    background: white;
    border-radius: var(--radius);
    padding: 48px;
    max-width: 400px;
    box-shadow: 0 20px 60px rgba(124,58,237,0.1);
  }
  .error-icon { font-size: 48px; margin-bottom: 16px; }
  .error-title { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
  .error-desc { font-size: 14px; color: #888; }

  .coupon-wrapper {
    width: 100%;
    max-width: 400px;
    position: relative;
    z-index: 1;
  }

  .coupon-card {
    background: var(--surface);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: 0 24px 64px rgba(124,58,237,0.18), 0 0 0 1px rgba(167,139,250,0.2);
    position: relative;
    transition: all 0.4s ease;
  }

  .coupon-card.used { filter: grayscale(0.3); }

  .coupon-stripe {
    height: 8px;
    background: linear-gradient(90deg, #7c3aed, #a78bfa, #c4b5fd);
  }
  .coupon-card.used .coupon-stripe {
    background: linear-gradient(90deg, #9ca3af, #d1d5db, #e5e7eb);
  }

  .coupon-vendor-header {
    background: linear-gradient(135deg, #7c3aed 0%, #5b21b6 100%);
    padding: 24px 28px 20px;
    position: relative;
    overflow: hidden;
  }
  .coupon-vendor-header::before {
    content: '';
    position: absolute; top: -40px; right: -40px;
    width: 160px; height: 160px;
    background: rgba(255,255,255,0.08);
    border-radius: 50%;
  }
  .coupon-vendor-header::after {
    content: '';
    position: absolute; bottom: -20px; left: 20px;
    width: 80px; height: 80px;
    background: rgba(255,255,255,0.05);
    border-radius: 50%;
  }

  .coupon-card.used .coupon-vendor-header {
    background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);
  }

  .vendor-name {
    font-size: 13px; font-weight: 600;
    color: rgba(255,255,255,0.7);
    letter-spacing: 2px; text-transform: uppercase;
    margin-bottom: 8px;
  }
  .coupon-type-name {
    font-size: 24px; font-weight: 800;
    color: white; line-height: 1.2;
    position: relative; z-index: 1;
  }
  .coupon-discount-badge {
    display: inline-block;
    background: rgba(255,255,255,0.18);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 30px;
    padding: 4px 14px;
    font-size: 12px; font-weight: 600;
    color: white;
    margin-top: 10px;
    position: relative; z-index: 1;
  }

  .coupon-divider {
    display: flex; align-items: center;
    padding: 0; position: relative;
  }
  .divider-circle-left, .divider-circle-right {
    width: 28px; height: 28px;
    background: var(--bg);
    border-radius: 50%;
    flex-shrink: 0;
    margin: 0 -14px;
    z-index: 2;
    box-shadow: inset 0 0 0 1px rgba(167,139,250,0.3);
  }
  .divider-line {
    flex: 1;
    border-top: 2px dashed rgba(167,139,250,0.35);
    margin: 0 6px;
  }

  .coupon-body { padding: 24px 28px 20px; }

  .coupon-title-row {
    display: flex; align-items: flex-start; justify-content: space-between;
    margin-bottom: 20px;
  }
  .coupon-title-text { font-size: 18px; font-weight: 700; color: var(--text); line-height: 1.3; }
  .coupon-num-badge {
    background: var(--accent3);
    color: var(--accent);
    font-size: 11px; font-weight: 700;
    padding: 3px 10px; border-radius: 20px;
    white-space: nowrap; margin-left: 10px; margin-top: 3px;
    font-family: 'JetBrains Mono', monospace;
  }

  .coupon-meta {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 12px; margin-bottom: 20px;
  }
  .meta-label {
    font-size: 10px; color: #9ca3af;
    letter-spacing: 1px; text-transform: uppercase;
    margin-bottom: 3px; font-weight: 600;
  }
  .meta-value { font-size: 13px; font-weight: 600; color: var(--text); font-family: 'JetBrains Mono', monospace; }

  .token-strip {
    background: #f5f3ff;
    border: 1px solid rgba(167,139,250,0.3);
    border-radius: var(--radius3);
    padding: 10px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; color: var(--text3);
    word-break: break-all;
    margin-bottom: 20px;
    letter-spacing: 0.3px;
  }

  .btn-use {
    width: 100%;
    background: linear-gradient(135deg, #7c3aed, #6d28d9);
    color: white; border: none;
    border-radius: var(--radius2);
    padding: 16px;
    font-size: 16px; font-weight: 700;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    transition: all 0.2s;
    box-shadow: 0 8px 24px rgba(124,58,237,0.3);
    letter-spacing: -0.3px;
  }
  .btn-use:hover { opacity: 0.92; transform: translateY(-1px); }
  .btn-use:active { transform: translateY(0); }
  .btn-use.used-btn {
    background: linear-gradient(135deg, #d1d5db, #9ca3af);
    cursor: not-allowed;
    box-shadow: none;
    pointer-events: none;
  }

  .used-stamp {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotate(-20deg);
    border: 4px solid rgba(156,163,175,0.7);
    color: rgba(107,114,128,0.7);
    border-radius: 12px;
    padding: 8px 20px;
    font-size: 36px; font-weight: 900;
    letter-spacing: 4px;
    pointer-events: none;
    z-index: 10;
    font-family: 'Noto Sans KR', sans-serif;
    white-space: nowrap;
    display: none;
  }
  .coupon-card.used .used-stamp { display: block; }

  .confirm-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    align-items: flex-end; justify-content: center;
    padding: 24px;
  }
  .confirm-overlay.show { display: flex; }

  .confirm-sheet {
    background: white;
    border-radius: 24px 24px 20px 20px;
    padding: 28px 24px;
    width: 100%; max-width: 400px;
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(40px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .confirm-warn {
    background: #fff7ed;
    border: 1px solid #fed7aa;
    border-radius: 12px;
    padding: 14px 16px;
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 20px;
  }
  .warn-icon { font-size: 20px; }
  .warn-text { font-size: 14px; font-weight: 600; color: #92400e; line-height: 1.4; }

  .confirm-title { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
  .confirm-desc { font-size: 13px; color: #6b7280; margin-bottom: 24px; line-height: 1.6; }

  .confirm-btns { display: flex; gap: 10px; }
  .btn-cancel {
    flex: 1;
    background: #f3f4f6; border: none;
    border-radius: 12px; padding: 14px;
    font-size: 14px; font-weight: 600;
    color: #6b7280; cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    transition: background 0.15s;
  }
  .btn-cancel:hover { background: #e5e7eb; }
  .btn-confirm-use {
    flex: 2;
    background: linear-gradient(135deg, #7c3aed, #6d28d9);
    color: white; border: none;
    border-radius: 12px; padding: 14px;
    font-size: 14px; font-weight: 700;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    box-shadow: 0 4px 12px rgba(124,58,237,0.3);
    transition: all 0.15s;
  }
  .btn-confirm-use:hover { opacity: 0.9; }
  .btn-confirm-use:disabled { opacity: 0.6; cursor: not-allowed; }

  .loading-page {
    text-align: center;
    color: var(--text3);
    font-size: 14px;
  }
  .loading-spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--accent3);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Vendor-specific header colors */
  .vendor-풍동 .coupon-vendor-header { background: linear-gradient(135deg, #d97706 0%, #92400e 100%); }
  .vendor-닭동가리 .coupon-vendor-header { background: linear-gradient(135deg, #059669 0%, #065f46 100%); }
  .vendor-해방피플클럽 .coupon-vendor-header { background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); }
  .vendor-수기소금 .coupon-vendor-header { background: linear-gradient(135deg, #e11d48 0%, #9f1239 100%); }
  .vendor-눈을담다 .coupon-vendor-header { background: linear-gradient(135deg, #7c3aed 0%, #5b21b6 100%); }
</style>
</head>
<body>

<div id="app">
  <div class="loading-page">
    <div class="loading-spinner"></div>
    쿠폰 정보를 불러오는 중...
  </div>
</div>

<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-sheet">
    <div class="confirm-warn">
      <span class="warn-icon">⚠️</span>
      <span class="warn-text">사용하면 쿠폰이 소멸됩니다.</span>
    </div>
    <div class="confirm-title">쿠폰을 사용하시겠습니까?</div>
    <div class="confirm-desc">이 쿠폰은 일회성입니다.<br>사용 후에는 다시 사용할 수 없습니다.</div>
    <div class="confirm-btns">
      <button class="btn-cancel" onclick="cancelUse()">취소</button>
      <button class="btn-confirm-use" id="confirmBtn" onclick="confirmUse()">사용하기</button>
    </div>
  </div>
</div>

<script>
// =============================================
// SUPABASE CONFIG
// =============================================
const SUPABASE_URL = 'https://scanpvkimaicpergakbe.supabase.co';
const SUPABASE_KEY = 'sb_publishable_CGS5dAKGRMOJwee2AsLtag_Q4zFLOVy';
const TABLE = 'coupons';

async function sbFetch(path, options = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': options.prefer || '',
      ...options.headers
    },
    ...options
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || res.statusText);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

async function dbGetCouponByToken(token) {
  const data = await sbFetch(`${TABLE}?token=eq.${encodeURIComponent(token)}&limit=1`);
  return data && data.length > 0 ? data[0] : null;
}

async function dbMarkUsed(token) {
  const usedDate = new Date().toISOString().split('T')[0];
  await sbFetch(`${TABLE}?token=eq.${encodeURIComponent(token)}`, {
    method: 'PATCH',
    body: JSON.stringify({ status: 'used', used_date: usedDate })
  });
  return usedDate;
}

// =============================================
// APP
// =============================================
const params = new URLSearchParams(location.search);
const token = params.get('token');
let couponData = null;

async function init() {
  if (!token) {
    renderError('유효하지 않은 쿠폰입니다', '쿠폰 링크를 다시 확인해주세요.');
    return;
  }

  try {
    couponData = await dbGetCouponByToken(token);
  } catch (e) {
    renderError('서버 연결 오류', '잠시 후 다시 시도해주세요: ' + e.message);
    return;
  }

  if (!couponData) {
    renderError('쿠폰을 찾을 수 없습니다', '만료되었거나 존재하지 않는 쿠폰입니다.');
    return;
  }

  if (couponData.status === 'deleted') {
    renderError('삭제된 쿠폰입니다', '이 쿠폰은 더 이상 유효하지 않습니다.');
    return;
  }

  const today = new Date().toISOString().split('T')[0];
  const isExpired = couponData.expire_date && today > couponData.expire_date && couponData.status !== 'used';
  const isUsed = couponData.status === 'used';

  renderCoupon(isUsed, isExpired);
}

function renderError(title, desc) {
  document.getElementById('app').innerHTML = `
    <div class="error-page">
      <div class="error-icon">❌</div>
      <div class="error-title">${title}</div>
      <div class="error-desc">${desc}</div>
    </div>`;
}

function renderCoupon(isUsed, isExpired) {
  const c = couponData;
  // vendor class: remove spaces for CSS class
  const vendorClass = 'vendor-' + c.vendor.replace(/\s/g, '');

  let statusText = isUsed ? '사용완료' : (isExpired ? '기간만료' : '미사용');
  let btnText = isUsed ? '✓ 사용완료' : (isExpired ? '기간 만료됨' : '🎫 쿠폰 사용하기');
  let btnClass = (isUsed || isExpired) ? 'btn-use used-btn' : 'btn-use';
  const disabled = (isUsed || isExpired) ? 'disabled' : '';

  const tokenDisplay = c.token ? c.token.substring(0, 32) + '...' : '';

  document.getElementById('app').innerHTML = `
    <div class="coupon-wrapper">
      <div class="coupon-card ${isUsed ? 'used' : ''} ${vendorClass}">
        <div class="used-stamp">USED</div>
        <div class="coupon-stripe"></div>
        <div class="coupon-vendor-header">
          <div class="vendor-name">${c.vendor}</div>
          <div class="coupon-type-name">${c.coupon_type}</div>
          <div class="coupon-discount-badge">일회용 쿠폰</div>
        </div>
        <div class="coupon-divider">
          <div class="divider-circle-left"></div>
          <div class="divider-line"></div>
          <div class="divider-circle-right"></div>
        </div>
        <div class="coupon-body">
          <div class="coupon-title-row">
            <div class="coupon-title-text">${c.title}</div>
            <div class="coupon-num-badge">${statusText}</div>
          </div>
          <div class="coupon-meta">
            <div class="meta-item">
              <div class="meta-label">발급일</div>
              <div class="meta-value">${c.issued_date || '-'}</div>
            </div>
            <div class="meta-item">
              <div class="meta-label">만료일</div>
              <div class="meta-value">${c.expire_date || '-'}</div>
            </div>
            ${isUsed ? `
            <div class="meta-item">
              <div class="meta-label">사용일</div>
              <div class="meta-value">${c.used_date || '-'}</div>
            </div>` : ''}
          </div>
          <div class="token-strip">${tokenDisplay}</div>
          <button class="${btnClass}" id="useBtn" onclick="requestUse()" ${disabled}>
            ${btnText}
          </button>
        </div>
      </div>
    </div>`;
}

function requestUse() {
  document.getElementById('confirmOverlay').classList.add('show');
}

function cancelUse() {
  document.getElementById('confirmOverlay').classList.remove('show');
}

async function confirmUse() {
  const btn = document.getElementById('confirmBtn');
  btn.disabled = true;
  btn.textContent = '처리 중...';

  try {
    const usedDate = await dbMarkUsed(token);
    couponData.status = 'used';
    couponData.used_date = usedDate;
  } catch (e) {
    btn.disabled = false;
    btn.textContent = '사용하기';
    alert('오류가 발생했습니다: ' + e.message);
    return;
  }

  document.getElementById('confirmOverlay').classList.remove('show');
  renderCoupon(true, false);
}

init();
</script>
</body>
</html>
