<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEAM GREEN - 쿠폰 서비스</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  /* 기본 스타일 초기화 */
  :root {
    --bg-color: #ffffff;
    --text-main: #333333;
    --text-red: #ff0000;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background-color: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  /* 전체 컨테이너: 이미지의 세로가 길기 때문에 중앙 배치 */
  #app {
    width: 100%;
    max-width: 450px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* 쿠폰 카드 영역 */
  .coupon-card {
    width: 100%;
    position: relative;
    overflow: hidden;
    line-height: 1.2;
  }

  /* 배경 이미지 설정 */
  .coupon-img {
    width: 100%;
    display: block;
  }

  /* 데이터 오버레이 스타일 */
  .overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none; /* 클릭은 아래 버튼에서 처리 */
  }

  /* 텍스트 위치 정밀 조정 (이미지 위치 기준) */
  .field { position: absolute; font-weight: 700; }

  /* 업체명 */
  .v-name { top: 30.5%; left: 19%; font-size: 1.6rem; color: #555; }
  /* 할인내용 (제목) */
  .v-type { top: 36.5%; left: 19%; font-size: 2.8rem; font-weight: 900; color: #000; }
  /* 쿠폰이름 (우측 하단 흰색) */
  .v-title { top: 43.5%; right: 19%; font-size: 0.95rem; color: #fff; }
  /* 발급일 */
  .v-issued { bottom: 48%; left: 22%; font-size: 1.1rem; color: #666; }
  /* 만료일 */
  .v-expire { bottom: 48%; left: 50%; font-size: 1.1rem; color: var(--text-red); }
  /* 상태 배지 (미사용/사용완료) */
  .v-status { bottom: 51%; right: 18%; font-size: 0.85rem; }

  /* 토큰 정보 영역 (하단) */
  .token-info {
    position: absolute;
    bottom: 20%;
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 10px;
    font-size: 0.75rem;
    color: #888;
  }

  /* 클릭 가능한 버튼 영역 (하단 '쿠폰 사용하기' 부분) */
  .use-btn-area {
    position: absolute;
    bottom: 33.5%;
    left: 50%;
    transform: translateX(-50%);
    width: 65%;
    height: 8%;
    cursor: pointer;
    background: transparent;
    border: none;
    pointer-events: auto;
  }

  /* 로딩 및 에러 스타일 */
  .status-msg { padding: 50px; text-align: center; background: white; border-radius: 20px; }

  /* 사용 완료 시 흑백 느낌을 주기 위한 필터 (선택 사항) */
  .is-used .coupon-img { filter: saturate(0.8); }
</style>
</head>
<body>

<div id="app">
  <div class="status-msg" id="loading">쿠폰 정보를 불러오는 중...</div>
</div>

<script>
/** * 1. 환경 설정 
 * 깃허브 업로드 시 이미지는 index.html과 같은 경로에 있어야 합니다.
 */
const CONFIG = {
  SUPABASE_URL: 'https://scanpvkimaicpergakbe.supabase.co',
  SUPABASE_KEY: 'sb_publishable_CGS5dAKGRMOJwee2AsLtag_Q4zFLOVy',
  TABLE: 'coupons',
  IMG_BEFORE: '쿠폰 사용 전 기본.png',
  IMG_AFTER: '쿠폰 사용완료 기본.png'
};

async function sbRequest(path, options = {}) {
  const res = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${path}`, {
    headers: {
      'apikey': CONFIG.SUPABASE_KEY,
      'Authorization': `Bearer ${CONFIG.SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      ...options.headers
    },
    ...options
  });
  if (!res.ok) throw new Error('네트워크 응답 오류');
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

const params = new URLSearchParams(location.search);
const token = params.get('token');
let couponData = null;

async function init() {
  if (!token) {
    showError('잘못된 접근입니다.', '쿠폰 토큰이 없습니다.');
    return;
  }

  try {
    const data = await sbRequest(`${CONFIG.TABLE}?token=eq.${token}&limit=1`);
    if (!data || data.length === 0) {
      showError('쿠폰을 찾을 수 없습니다.', '이미 만료되었거나 삭제된 쿠폰입니다.');
      return;
    }
    couponData = data[0];
    render();
  } catch (e) {
    showError('연결 오류', '서버에 접속할 수 없습니다.');
  }
}

function showError(title, desc) {
  document.getElementById('app').innerHTML = `
    <div class="status-msg">
      <h2>${title}</h2><p>${desc}</p>
    </div>`;
}

function render() {
  const isUsed = couponData.status === 'used';
  const currentImg = isUsed ? CONFIG.IMG_AFTER : CONFIG.IMG_BEFORE;
  const statusText = isUsed ? '사용완료' : '미사용';
  const statusColor = isUsed ? '#888' : '#7c3aed';

  document.getElementById('app').innerHTML = `
    <div class="coupon-card ${isUsed ? 'is-used' : ''}">
      <img src="${currentImg}" class="coupon-img" alt="쿠폰배경">

      <div class="overlay">
        <div class="field v-name">${couponData.vendor}</div>
        <div class="field v-title">${couponData.title}</div>
        <div class="field v-type">${couponData.coupon_type}</div>
        
        <div class="field v-status" style="color: ${statusColor}">${statusText}</div>
        <div class="field v-issued">${couponData.issued_date || '2026-05-27'}</div>
        <div class="field v-expire">${couponData.expire_date || '2026-00-00'}</div>

        <div class="token-info">
          <span>${couponData.token.substring(0,6)}</span>
          <span>${couponData.token.substring(6,12)}</span>
          <span>${couponData.token.substring(12,18)}</span>
        </div>

        ${!isUsed ? `<button class="use-btn-area" onclick="useCoupon()"></button>` : ''}
      </div>
    </div>
  `;
}

async function useCoupon() {
  if (!confirm('쿠폰을 지금 사용하시겠습니까?')) return;

  try {
    const today = new Date().toISOString().split('T')[0];
    await sbRequest(`${CONFIG.TABLE}?token=eq.${token}`, {
      method: 'PATCH',
      body: JSON.stringify({ status: 'used', used_date: today })
    });
    alert('사용 처리가 완료되었습니다.');
    location.reload(); // 상태 업데이트를 위해 새로고침
  } catch (e) {
    alert('오류가 발생했습니다. 다시 시도해주세요.');
  }
}

init();
</script>
</body>
</html>
