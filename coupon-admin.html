<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KMU 미니올림픽 쿠폰 발급 관리 시스템</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #1a1a26;
    --surface3: #22223a;
    --border: rgba(120,120,200,0.12);
    --border2: rgba(120,120,200,0.25);
    --accent: #7c6af0;
    --accent2: #a78bfa;
    --gold: #f5c842;
    --teal: #2dd4bf;
    --coral: #f87171;
    --text: #e8e8f0;
    --text2: #9898b8;
    --text3: #6060a0;
    --radius: 12px;
    --radius2: 8px;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 32px; font-size: 14px; line-height: 1.5; }
  
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  .logo { font-size: 18px; font-weight: 700; color: var(--accent2); display: flex; align-items: center; gap: 8px; }
  
  .db-status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); font-family: 'JetBrains Mono', monospace; }
  .db-dot { width: 8px; height: 8px; border-radius: 50%; background: #6060a0; }
  .db-dot.ok { background: var(--teal); }
  .db-dot.err { background: var(--coral); }

  .section-title { font-size: 13px; font-weight: 600; letter-spacing: 1px; color: var(--text3); text-transform: uppercase; margin: 24px 0 12px 0; display: flex; align-items: center; gap: 6px; }
  .section-title::before { content:''; display:block; width:3px; height:12px; background: var(--accent); border-radius: 2px; }

  /* 현장 배포 대시보드 트리구조화 */
  .dashboard-wrapper { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 24px; }
  .dashboard-header { font-size: 14px; font-weight: 700; margin-bottom: 16px; color: var(--text); display: flex; align-items: center; justify-content: space-between; }
  .grid-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .card-stat { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius2); padding: 16px; position: relative; }
  .card-stat::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; border-radius: 3px 3px 0 0; }
  .card-stat.pd::before { background: #f59e0b; }
  .card-stat.dg::before { background: #10b981; }
  .card-stat.nd::before { background: #8b5cf6; }
  .stat-lbl { font-size: 12px; color: var(--text3); margin-bottom: 4px; font-weight: 500; }
  .stat-val { font-size: 24px; font-weight: 700; font-family: 'JetBrains Mono', monospace; color: var(--text); }
  .stat-val span { font-size: 14px; color: var(--text3); font-weight: 400; }

  /* 듀얼 모니터 제어 패널 */
  .control-panel { background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius); padding: 20px; display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
  .btn-live-window { background: linear-gradient(135deg, #f59e0b, #ef4444); color: white; border: none; border-radius: var(--radius2); padding: 12px 20px; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .btn-live-window:hover { opacity: 0.9; }
  
  .remote-box { display: none; align-items: center; gap: 12px; background: var(--surface2); padding: 8px 16px; border-radius: var(--radius2); border: 1px solid var(--border); }
  .remote-btn { background: var(--surface3); border: 1px solid var(--border2); color: var(--text); padding: 8px 16px; font-size: 13px; font-weight: 600; border-radius: 6px; cursor: pointer; }
  .remote-btn:hover:not(:disabled) { background: #f59e0b; color: #000; }
  .remote-btn:disabled { opacity: 0.2; cursor: not-allowed; }
  .remote-counter { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; color: var(--gold); min-width: 60px; text-align: center; }

  /* 발급내역 전용 컨트롤러 및 탭구조 */
  .tabs-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 4px; }
  .tab { padding: 6px 14px; border-radius: var(--radius2); font-size: 13px; font-weight: 500; cursor: pointer; color: var(--text2); border: none; background: none; transition: all 0.1s; }
  .tab.active { background: var(--surface3); color: var(--text); font-weight: 700; }

  /* 초간소화 테이블 */
  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 16px; }
  table { width: 100%; border-collapse: collapse; text-align: left; }
  th { padding: 10px 16px; font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; background: var(--surface2); border-bottom: 1px solid var(--border); letter-spacing: 0.5px; }
  td { padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--text2); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(124,106,240,0.03); }
  
  .title-cell { font-weight: 700; color: var(--text); }
  .status-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .status-unused { background: rgba(248,113,113,0.12); color: #f87171; border: 1px solid rgba(248,113,113,0.2); }
  .status-used   { background: rgba(45,212,191,0.12); color: #2dd4bf; border: 1px solid rgba(45,212,191,0.2); }

  .btn-del { background: none; border: 1px solid rgba(248,113,113,0.2); color: #f87171; border-radius: 4px; padding: 3px 8px; font-size: 11px; cursor: pointer; }
  .btn-del:hover { background: rgba(248,113,113,0.1); border-color: rgba(248,113,113,0.4); }

  /* 페이징 컴포넌트 */
  .pagination { display: flex; justify-content: center; align-items: center; gap: 16px; margin-bottom: 24px; }
  .page-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .page-btn:hover:not(:disabled) { border-color: var(--accent2); color: var(--accent2); }
  .page-btn:disabled { opacity: 0.2; cursor: not-allowed; }
  .page-info { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text3); }

  /* 고속 생성엔진 */
  .issue-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .issue-flex { display: flex; gap: 12px; align-items: center; }
  .btn-issue-loop { background: linear-gradient(135deg, var(--accent), #9f7aea); color: white; border: none; border-radius: var(--radius2); padding: 12px 24px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .btn-issue-loop:hover:not(:disabled) { opacity: 0.9; }
  .btn-issue-loop:disabled { opacity: 0.3; cursor: not-allowed; }
  .next-indicator { font-size: 12px; color: var(--text2); font-family: 'JetBrains Mono', monospace; background: var(--surface2); padding: 8px 14px; border-radius: 6px; border: 1px solid var(--border); margin-left: auto; }

  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--surface3); border: 1px solid var(--border2); border-radius: var(--radius2); padding: 10px 18px; font-size: 13px; z-index: 9999; color: var(--text); transform: translateY(10px); opacity: 0; transition: all 0.2s; pointer-events: none; }
  .toast.show { transform: translateY(0); opacity: 1; }

  .pw-screen { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 9999; align-items: center; justify-content: center; }
  .pw-screen.show { display: flex; }
  .pw-box { background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius); padding: 32px; width: 320px; text-align: center; }
  .pw-input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius2); color: var(--text); padding: 10px; font-size: 16px; text-align: center; margin-bottom: 12px; outline: none; }
  .pw-btn { width: 100%; background: linear-gradient(135deg, var(--accent), #9f7aea); color: white; border: none; border-radius: var(--radius2); padding: 10px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>

<div class="pw-screen show" id="pwScreen">
  <div class="pw-box">
    <div style="font-size:28px; margin-bottom:12px;">🔐</div>
    <div style="font-weight:700; margin-bottom:16px;">현장 제어 마스터 비밀번호</div>
    <input class="pw-input" type="password" id="pwInput" placeholder="••••••" onkeydown="if(event.key==='Enter') checkPassword()">
    <button class="pw-btn" onclick="checkPassword()">인증하기</button>
  </div>
</div>

<div class="header">
  <div class="logo">🎫 KMU 미니올림픽 관제 스크린 <span style="font-size:12px; font-weight:400; color:var(--text3);">[현장운영전용]</span></div>
  <div class="db-status"><div class="db-dot" id="dbDot"></div><span id="dbLabel">연결망 분석중</span></div>
</div>

<div class="section-title">현장 배포 종합 대시보드</div>
<div class="dashboard-wrapper">
  <div class="dashboard-header">
    <span>📊 배포 한도 충전 스케일링</span>
    <span style="font-family:'JetBrains Mono'; font-weight:700; color:var(--accent2);" id="txtTotal">총 발급수: 0 / 310매</span>
  </div>
  <div class="grid-stats">
    <div class="card-stat pd"><div class="stat-lbl">🍊 풍동 배포 모듈</div><div class="stat-val" id="cntPd">0 <span>/ 100</span></div></div>
    <div class="card-stat dg"><div class="stat-lbl">🍏 닭동가리 배포 모듈</div><div class="stat-val" id="cntDg">0 <span>/ 130</span></div></div>
    <div class="card-stat nd"><div class="stat-lbl">🍇 눈을 담다 배포 모듈</div><div class="stat-val" id="cntNd">0 <span>/ 80</span></div></div>
  </div>
</div>

<div class="section-title">듀얼 디스플레이 송출 파이프라인</div>
<div class="control-panel">
  <button class="btn-live-window" onclick="openLiveWindow()">🖥 관람객용 외부 스크린 창 열기</button>
  <div class="remote-box" id="remoteBox">
    <span style="font-size:12px; color:var(--gold); font-weight:600;">실시간 송출 제어:</span>
    <button class="remote-btn" id="btnPrev" onclick="moveSlide(-1)">◀ 이전 쿠폰</button>
    <div class="remote-counter" id="remoteCounter">0 / 0</div>
    <button class="remote-btn" id="btnNext" onclick="moveSlide(1)">다음 쿠폰 ▶</button>
  </div>
</div>

<div class="tabs-container">
  <div class="section-title" style="margin:0;">📝 모니터링 내역 로그 (10개씩 묶음)</div>
  <div class="tabs">
    <button class="tab active" id="tab-live" onclick="switchTab('live')">현장 배포 창 (통합)</button>
    <button class="tab" id="tab-pd" onclick="switchTab('풍동')">풍동</button>
    <button class="tab" id="tab-dg" onclick="switchTab('닭동가리')">닭동가리</button>
    <button class="tab" id="tab-nd" onclick="switchTab('눈을 담다')">눈을 담다</button>
  </div>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th style="width: 25%;">제목</th>
        <th style="width: 45%;">종류 (혜택 명세)</th>
        <th style="width: 18%;">상태</th>
        <th style="width: 12%;">삭제</th>
      </tr>
    </thead>
    <tbody id="couponTableBody">
      <tr><td colspan="4" style="text-align:center; color:var(--text3); padding:30px;">데이터 로딩 중...</td></tr>
    </tbody>
  </table>
</div>

<div class="pagination">
  <button class="page-btn" id="pPrev" onclick="movePage(-1)">◀ 이전</button>
  <div class="page-info" id="pageInfo">1 / 1</div>
  <button class="page-btn" id="pNext" onclick="movePage(1)">다음 ▶</button>
</div>

<div class="section-title">쿠폰 실시간 고속 충전 엔진</div>
<div class="issue-box">
  <div class="issue-flex">
    <button class="btn-issue-loop" id="btnLoop" onclick="issueLoopCoupon()">🔄 순환 발행하기 (한 장씩 채우기)</button>
    <div class="next-indicator" id="nextIndicator">분석 중...</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://scanpvkimaicpergakbe.supabase.co';
const SUPABASE_KEY = 'sb_publishable_CGS5dAKGRMOJwee2AsLtag_Q4zFLOVy';
const TABLE = 'coupons';

const LIMITS = { '풍동': 100, '닭동가리': 130, '눈을 담다': 80 };
const LOOP_ORDER = ['풍동', '닭동가리', '눈을 담다'];
const VENDOR_MAPPING = { '풍동': '1,000원할인    ', '닭동가리': '음료증정', '눈을 담다': '아메리카노 1,000원 할인 / 요거트아이스크림 3,000원 할인 택  1    ' };

let coupons = [];
let liveWindow = null;
let liveCurrentIdx = 0;
let currentVendorTarget = '풍동';

// 페이징 변수
let currentTab = 'live'; // 'live', '풍동', '닭동가리', '눈을 담다'
let currentPage = 1;
const PAGE_SIZE = 10;

async function sbFetch(path, options = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': options.prefer || '', ...options.headers }, ...options
  });
  if (!res.ok) throw new Error("네트워크 연동 실패");
  const text = await res.text(); return text ? JSON.parse(text) : null;
}

const ADMIN_PW = 'admin';
function checkPassword() {
  const input = document.getElementById('pwInput');
  if (input.value === ADMIN_PW) { sessionStorage.setItem('admin_auth', '1'); document.getElementById('pwScreen').classList.remove('show'); }
  else { alert('비밀번호 불일치'); input.value = ''; }
}

window.onload = async function() {
  if (sessionStorage.getItem('admin_auth') === '1') document.getElementById('pwScreen').classList.remove('show');
  await loadData();
  setInterval(loadData, 10000); // 10초 주기 실시간 자동 동기화
  setInterval(() => { if (liveWindow && liveWindow.closed) { liveWindow = null; document.getElementById('remoteBox').style.display = 'none'; } }, 1000);
};

async function loadData() {
  try {
    const data = await sbFetch(`${TABLE}?status=neq.deleted`);
    coupons = data || [];
    setDbStatus(true);
    calculateStats();
    renderTable();
  } catch (e) { setDbStatus(false); }
}

function setDbStatus(ok) {
  const dot = document.getElementById('dbDot'); const lbl = document.getElementById('dbLabel');
  dot.className = 'db-dot ' + (ok ? 'ok' : 'err'); lbl.textContent = ok ? 'Supabase 클라우드 실시간 연동중' : '동기화 연결 끊김';
}

function calculateStats() {
  const pCount = coupons.filter(c => c.vendor === '풍동').length;
  const dCount = coupons.filter(c => c.vendor === '닭동가리').length;
  const nCount = coupons.filter(c => c.vendor === '눈을 담다').length;

  document.getElementById('cntPd').innerHTML = `${pCount} <span>/ 100</span>`;
  document.getElementById('cntDg').innerHTML = `${dCount} <span>/ 130</span>`;
  document.getElementById('cntNd').innerHTML = `${nCount} <span>/ 80</span>`;
  document.getElementById('txtTotal').textContent = `총 발급수: ${pCount + dCount + nCount} / 310매`;

  determineNextVendor(pCount, dCount, nCount);
  if (liveWindow && !liveWindow.closed) { syncLiveDisplay(); }
}

function determineNextVendor(p, d, n) {
  let options = [];
  if (p < LIMITS['풍동']) options.push('풍동');
  if (d < LIMITS['닭동가리']) options.push('닭동가리');
  if (n < LIMITS['눈을 담다']) options.push('눈을 담다');

  if (options.length === 0) {
    currentVendorTarget = null;
    document.getElementById('nextIndicator').textContent = "🎉 모든 쿠폰 완판 (310매 충전 완료)";
    document.getElementById('btnLoop').disabled = true;
    return;
  }

  for (let i = 0; i < LOOP_ORDER.length; i++) {
    let checkVendor = LOOP_ORDER[i];
    if (options.includes(checkVendor)) {
      currentVendorTarget = checkVendor;
      break;
    }
  }
  if(!currentVendorTarget) currentVendorTarget = options[0];
  document.getElementById('nextIndicator').textContent = `다음 생성 대기: [${currentVendorTarget}]`;
}

// 필터링된 타깃 쿠폰 어레이 추출 알고리즘
function getFilteredCoupons() {
  if (currentTab === 'live') {
    return coupons.filter(c => LOOP_ORDER.includes(c.vendor));
  } else {
    return coupons.filter(c => c.vendor === currentTab);
  }
}

// 간소화 내역 렌더링 + 10장 페이징 통합 처리
function renderTable() {
  const dataset = getFilteredCoupons();
  
  // 역순 정렬 (최신순 매핑)
  dataset.sort((a, b) => b.created_at?.localeCompare(a.created_at) || b.title.localeCompare(a.title));

  const totalPages = Math.max(1, Math.ceil(dataset.length / PAGE_SIZE));
  if (currentPage > totalPages) currentPage = totalPages;

  document.getElementById('pageInfo').textContent = `${currentPage} / ${totalPages}`;
  document.getElementById('pPrev').disabled = (currentPage === 1);
  document.getElementById('pNext').disabled = (currentPage === totalPages);

  const startIdx = (currentPage - 1) * PAGE_SIZE;
  const pageData = dataset.slice(startIdx, startIdx + PAGE_SIZE);

  const tbody = document.getElementById('couponTableBody');
  if (pageData.length === 0) {
    tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:var(--text3); padding:40px;">발급 내역 기록 로그가 비어있습니다.</td></tr>`;
    return;
  }

  tbody.innerHTML = pageData.map(c => {
    const statusHtml = c.status === 'used' 
      ? '<span class="status-badge status-used">사용완료</span>' 
      : '<span class="status-badge status-unused">미사용</span>';
    return `
      <tr>
        <td><span class="title-cell">[${c.vendor}] ${c.title}</span></td>
        <td style="color:var(--text2); font-size:12px;">${c.coupon_type}</td>
        <td>${statusHtml}</td>
        <td><button class="btn-del" onclick='deleteCoupon(${JSON.stringify(c.id)})'>삭제</button></td>
      </tr>
    `;
  }).join('');
}

function switchTab(tab) {
  currentTab = tab;
  currentPage = 1;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  if(tab === 'live') document.getElementById('tab-live').classList.add('active');
  if(tab === '풍동') document.getElementById('tab-pd').classList.add('active');
  if(tab === '닭동가리') document.getElementById('tab-dg').classList.add('active');
  if(tab === '눈을 담다') document.getElementById('tab-nd').classList.add('active');
  renderTable();
}

function movePage(dir) {
  currentPage += dir;
  renderTable();
}

async function issueLoopCoupon() {
  if (!currentVendorTarget) return;
  const vendor = currentVendorTarget;
  const existingCount = coupons.filter(c => c.vendor === vendor).length;
  
  if (existingCount >= LIMITS[vendor]) {
    showToast(`⚠ ${vendor} 한도 도달 완료.`);
    await loadData(); return;
  }

  const btn = document.getElementById('btnLoop');
  btn.disabled = true;
  
  const token = Array.from(crypto.getRandomValues(new Uint8Array(32)), b => b.toString(16).padStart(2,'0')).join('');
  const url = `${location.origin}/coupon-use.html?token=${token}`;
  
  const today = new Date().toISOString().split('T')[0];
  const expDate = new Date(); expDate.setDate(expDate.getDate() + 30);
  
  const newCoupon = {
    token,
    title: `#${existingCount + 1}`,
    vendor: vendor,
    coupon_type: VENDOR_MAPPING[vendor],
    status: 'unused',
    issued_date: today,
    expire_date: expDate.toISOString().split('T')[0],
    url: url
  };

  try {
    await sbFetch(TABLE, { method: 'POST', prefer: 'return=representation', body: JSON.stringify(newCoupon) });
    showToast(`✅ [${vendor}] ${newCoupon.title} 실시간 원격 생성 성공`);
    await loadData();
  } catch(e) {
    showToast("❌ 생성 트랜잭션 오류");
  } finally {
    btn.disabled = false;
  }
}

// =========================================================================
// 🖥 듀얼 모니터 외부창 클라이언트 제어 레이어
// =========================================================================
function openLiveWindow() {
  const liveCoupons = coupons.filter(c => LOOP_ORDER.includes(c.vendor));
  if (liveCoupons.length === 0) { showToast("송출 가능한 현장 쿠폰 데이터가 없습니다."); return; }
  
  if (liveWindow && !liveWindow.closed) { liveWindow.close(); }

  liveWindow = window.open('', 'KmuMiniOlympicLive', 'width=750,height=850,top=50,left=300,resizable=yes');
  if(!liveWindow) { alert("브라우저 팝업 차단을 해제해 주세요!"); return; }

  liveWindow.document.write(`
    <!DOCTYPE html>
    <html>
    <head>
      <title>KMU 미니올림픽 현장 쿠폰 배포 스크린</title>
      <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
      <style>
        body { background: #050508; color: #e8e8f0; font-family: 'Noto Sans KR', sans-serif; text-align: center; padding: 50px 20px; overflow: hidden; margin:0; }
        .branding { font-size: 18px; color: #6060a0; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 30px; }
        .v-box { min-height: 100px; margin-bottom: 20px; }
        .v-name { font-size: 48px; font-weight: 700; color: #fff; text-shadow: 0 0 20px rgba(124,106,240,0.3); }
        .v-type { font-size: 18px; color: #a78bfa; margin-top: 8px; }
        .qr-area { background: #ffffff; padding: 24px; border-radius: 16px; display: inline-block; box-shadow: 0 25px 50px rgba(0,0,0,0.7); margin-bottom: 30px; }
        .lbl-title { font-family: 'JetBrains Mono', monospace; font-size: 15px; color: #f5c842; background: #111118; padding: 6px 16px; border-radius: 6px; display: inline-block; border: 1px solid rgba(120,120,200,0.1); }
      </style>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/script>
    </head>
    <body>
      <div class="branding">🏆 KMU 미니올림픽 현장 쿠폰 배포 스크린</div>
      <div class="v-box">
        <div class="v-name" id="lVendor">-</div>
        <div class="v-type" id="lType">-</div>
      </div>
      <div class="qr-area"><div id="winQr"></div></div>
      <br>
      <div class="lbl-title" id="lTitle">-</div>
    </body>
    </html>
  `);
  liveWindow.document.close();
  
  document.getElementById('remoteBox').style.display = 'flex';
  liveCurrentIdx = 0;
  syncLiveDisplay();
}

function getSortedLiveCoupons() {
  return coupons.filter(c => LOOP_ORDER.includes(c.vendor)).sort((a, b) => {
    const numA = parseInt(a.title.replace(/[^0-9]/g, '')) || 0;
    const numB = parseInt(b.title.replace(/[^0-9]/g, '')) || 0;
    if (numA !== numB) return numA - numB;
    return LOOP_ORDER.indexOf(a.vendor) - LOOP_ORDER.indexOf(b.vendor);
  });
}

function syncLiveDisplay() {
  if (!liveWindow || liveWindow.closed) return;
  const sorted = getSortedLiveCoupons();
  if (sorted.length === 0) return;

  if (liveCurrentIdx >= sorted.length) liveCurrentIdx = sorted.length - 1;
  if (liveCurrentIdx < 0) liveCurrentIdx = 0;

  const target = sorted[liveCurrentIdx];
  const doc = liveWindow.document;

  doc.getElementById('lVendor').textContent = target.vendor;
  doc.getElementById('lType').textContent = target.coupon_type;
  doc.getElementById('lTitle').textContent = `일련번호: ${target.vendor} ${target.title}`;

  const qrContainer = doc.getElementById('winQr');
  qrContainer.innerHTML = '';
  new liveWindow.QRCode(qrContainer, {
    text: target.url,
    width: 320,
    height: 320,
    colorDark: '#000000',
    colorLight: '#ffffff',
    correctLevel: 1
  });

  document.getElementById('remoteCounter').textContent = `${liveCurrentIdx + 1} / ${sorted.length}`;
  document.getElementById('btnPrev').disabled = (liveCurrentIdx === 0);
  document.getElementById('btnNext').disabled = (liveCurrentIdx === sorted.length - 1);
}

function moveSlide(dir) {
  const sorted = getSortedLiveCoupons();
  const nextIdx = liveCurrentIdx + dir;
  if (nextIdx >= 0 && nextIdx < sorted.length) {
    liveCurrentIdx = nextIdx;
    syncLiveDisplay();
  }
}

async function deleteCoupon(id) {
  if (!confirm('현장 관리 보호: 정말 이 쿠폰 코드를 완전 파기(삭제)하시겠습니까?')) return;
  try {
    await sbFetch(`${TABLE}?id=eq.${id}`, { method: 'PATCH', body: JSON.stringify({ status: 'deleted' }) });
    showToast('선택한 쿠폰 파기 완료');
    await loadData();
  } catch (e) { showToast('파기 실패'); }
}

function showToast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
</script>
